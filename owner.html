<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Record | Owner Control Panel</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-container { max-width: 650px; margin: 2rem auto; padding: 1.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.85rem; color: var(--accent-cyan); margin-bottom: 0.4rem; }
    input, textarea, select {
      width: 100%; padding: 0.75rem; background: #070a12; border: 1px solid var(--border-neon);
      border-radius: 8px; color: #fff; font-family: inherit; font-size: 0.9rem;
    }
    .panel-block { background: rgba(11, 16, 26, 0.85); border: 1px solid var(--border-neon); border-radius: 14px; padding: 1.5rem; margin-bottom: 2rem; }
  </style>
</head>
<body style="background: #030508;">

  <div class="admin-container">
    <!-- AUTH BOX -->
    <div id="auth-box" class="panel-block">
      <h2 class="brand-cursive" style="font-size: 2.5rem; margin-bottom: 0.5rem;">The Record</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Owner authentication required.</p>
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@email.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>
      <button class="btn-glow" onclick="handleLogin()" style="width: 100%; justify-content: center; cursor: pointer;">Sign In</button>
      <p id="login-msg" style="color: #f87171; margin-top: 10px; font-size: 0.85rem;"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-box" style="display: none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <div>
          <h3>Owner Dashboard</h3>
          <span style="font-size: 0.75rem; color: var(--accent-cyan);">The Record Control Center</span>
        </div>
        <div>
          <a href="index.html" class="btn-glow" style="padding: 0.3rem 0.8rem; font-size:0.75rem;" target="_blank">View Site</a>
          <button onclick="handleLogout()" class="btn-glow" style="padding: 0.3rem 0.8rem; font-size:0.75rem; background:#dc2626; border-color:#dc2626; cursor:pointer;">Logout</button>
        </div>
      </div>

      <!-- 1. CHANGE VISITOR PASSWORD -->
      <div class="panel-block">
        <h4 style="color: var(--accent-cyan); margin-bottom: 0.8rem;">🔒 Set Visitor Access Password</h4>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.8rem;">
          Normal visitors will have to enter this password to view the site.
        </p>
        <div class="form-group">
          <label>New Visitor Password</label>
          <input id="new-visitor-pass" placeholder="e.g. jinwoo2026" />
        </div>
        <button class="btn-glow" onclick="changeVisitorPassword()" style="cursor: pointer;">Update Visitor Password</button>
      </div>

      <!-- 2. PHOTO & AUDIO UPLOADER -->
      <div class="panel-block">
        <h4 style="color: var(--accent-cyan); margin-bottom: 0.8rem;">📁 Upload Image / Music</h4>
        <div class="form-group">
          <label>Select File</label>
          <input type="file" id="file-upload" />
        </div>
        <div class="form-group">
          <label>Select Bucket</label>
          <select id="bucket-select">
            <option value="images">images (for anime hero / writing cover)</option>
            <option value="music">music (for audio player)</option>
          </select>
        </div>
        <button class="btn-glow" onclick="uploadFile()" style="cursor: pointer;">Upload</button>
        <div id="upload-result" style="margin-top: 10px; font-size: 0.8rem; word-break: break-all;"></div>
      </div>

      <!-- 3. BIO & HERO SETTINGS -->
      <div class="panel-block">
        <h4 style="color: var(--accent-cyan); margin-bottom: 0.8rem;">✏️ Edit Hero & 4 Info Cards</h4>
        <div class="form-group"><label>Hero Image URL</label><input id="set-hero-img" placeholder="Paste uploaded image link" /></div>
        <div class="form-group"><label>Age Card Value</label><input id="set-age" placeholder="16" /></div>
        <div class="form-group"><label>Education Card Value</label><input id="set-edu" placeholder="12th (PCMB) CHSE Odisha" /></div>
        <div class="form-group"><label>Home Card Value</label><input id="set-loc" placeholder="Odisha, India" /></div>
        <div class="form-group"><label>Coding Card Value</label><input id="set-code" placeholder="Beginner" /></div>
        <div class="form-group"><label>About Paragraph</label><textarea id="set-about" rows="3"></textarea></div>
        <button class="btn-glow" onclick="saveSettings()" style="cursor: pointer;">Save Information</button>
      </div>

      <!-- 4. POST WRITING -->
      <div class="panel-block">
        <h4 style="color: var(--accent-cyan); margin-bottom: 0.8rem;">✍️ Post Writing / Thought</h4>
        <div class="form-group"><label>Title</label><input id="w-title" /></div>
        <div class="form-group"><label>Content</label><textarea id="w-content" rows="3"></textarea></div>
        <div class="form-group"><label>Cover Image URL (Optional)</label><input id="w-cover" /></div>
        <div class="form-group"><label>Date</label><input id="w-date" placeholder="e.g. Aug 26, 2026" /></div>
        <button class="btn-glow" onclick="addWriting()" style="cursor: pointer;">Publish Writing</button>
      </div>

      <!-- 5. ADD MUSIC TRACK -->
      <div class="panel-block">
        <h4 style="color: var(--accent-cyan); margin-bottom: 0.8rem;">🎵 Add Song to Player</h4>
        <div class="form-group"><label>Track Title</label><input id="m-title" /></div>
        <div class="form-group"><label>Artist Name</label><input id="m-artist" /></div>
        <div class="form-group"><label>Audio Public URL</label><input id="m-url" /></div>
        <button class="btn-glow" onclick="addMusic()" style="cursor: pointer;">Add Track</button>
      </div>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script>
    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('dashboard-box').style.display = 'block';
        loadSettings();
      } else {
        document.getElementById('auth-box').style.display = 'block';
        document.getElementById('dashboard-box').style.display = 'none';
      }
    }

    async function handleLogin() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) document.getElementById('login-msg').innerText = error.message;
      else checkSession();
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    async function loadSettings() {
      const { data } = await supabaseClient.from('site_settings').select('*').single();
      if (data) {
        document.getElementById('set-hero-img').value = data.hero_image || '';
        document.getElementById('set-age').value = data.age || '';
        document.getElementById('set-edu').value = data.education || '';
        document.getElementById('set-loc').value = data.location || '';
        document.getElementById('set-code').value = data.coding_status || '';
        document.getElementById('set-about').value = data.about_text || '';
      }
    }

    async function changeVisitorPassword() {
      const p = document.getElementById('new-visitor-pass').value;
      if (!p) return alert('Enter a password first');
      const { error } = await supabaseClient.from('site_settings').update({ footer_text: 'PASS:' + p.trim() }).eq('id', 1);
      if (!error) {
        alert('Visitor password updated successfully to: ' + p);
        document.getElementById('new-visitor-pass').value = '';
      } else alert(error.message);
    }

    async function uploadFile() {
      const file = document.getElementById('file-upload').files[0];
      const bucket = document.getElementById('bucket-select').value;
      if (!file) return alert('Select file first');
      const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
      document.getElementById('upload-result').innerText = 'Uploading...';
      const { error } = await supabaseClient.storage.from(bucket).upload(fileName, file);
      if (error) document.getElementById('upload-result').innerText = error.message;
      else {
        const { data } = supabaseClient.storage.from(bucket).getPublicUrl(fileName);
        document.getElementById('upload-result').innerHTML = `Uploaded URL:<br><input value="${data.publicUrl}" readonly onclick="this.select()" />`;
      }
    }

    async function saveSettings() {
      const updates = {
        hero_image: document.getElementById('set-hero-img').value,
        age: document.getElementById('set-age').value,
        education: document.getElementById('set-edu').value,
        location: document.getElementById('set-loc').value,
        coding_status: document.getElementById('set-code').value,
        about_text: document.getElementById('set-about').value,
        updated_at: new Date()
      };
      const { error } = await supabaseClient.from('site_settings').update(updates).eq('id', 1);
      if (!error) alert('Saved successfully!');
      else alert(error.message);
    }

    async function addWriting() {
      const title = document.getElementById('w-title').value;
      const content = document.getElementById('w-content').value;
      const cover_image = document.getElementById('w-cover').value;
      const date_str = document.getElementById('w-date').value || 'Recent';
      if (!title || !content) return alert('Fill title and content');
      const { error } = await supabaseClient.from('writings').insert([{ title, content, cover_image, date_str }]);
      if (!error) {
        alert('Writing published!');
        document.getElementById('w-title').value = '';
        document.getElementById('w-content').value = '';
      }
    }

    async function addMusic() {
      const title = document.getElementById('m-title').value;
      const artist = document.getElementById('m-artist').value || 'Unknown';
      const audio_url = document.getElementById('m-url').value;
      if (!title || !audio_url) return alert('Fill title and audio URL');
      const { error } = await supabaseClient.from('music').insert([{ title, artist, audio_url }]);
      if (!error) {
        alert('Song added!');
        document.getElementById('m-title').value = '';
        document.getElementById('m-url').value = '';
      }
    }

    window.addEventListener('DOMContentLoaded', checkSession);
  </script>
</body>
</html>
